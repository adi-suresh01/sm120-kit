issue = "sglang-33422"
# Sized for the 11-05 decode pair on a Max-Q box downloading at ~100 MB/s (README.md): up and setup about 47 min
# (image pull, NCCL probe, 167 GB of weights), d1 36 (its boot pays the DeepGEMM precompile), d2 29, d3 29. d1 and d2
# end near 1.9 h; d3 runs only when setup ends with 95 min left (README.md's rule), and last. The 10-17 variants
# below do not fit: run them by name with their own planned_hours (1.75 then).
planned_hours = 2.25

[pod]
# The newest release; FlashInfer 0.7.1 serves the DSpark draft's topk=192 without PR #33407 (README.md).
image = "lmsysorg/sglang:v0.5.22-cu130@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae"
count = 4
min_cuda = "13.0"
# On Vast both sizes make one 280 GB disk: the image, 167 GB of weights, ShareGPT, the prompts, and logs. On RunPod
# the weights stay on container disk, since /workspace is a FUSE mount on secure pods and read the vllm-56771
# checkpoint too slowly to boot.
container_disk_gb = 260
volume_gb = 20
needs_hf_token = false
# The P2P-on arms need a box where P2P can work at all.
require_p2p = true
# The image (15.6 GB compressed), the weights (166.9 GB), ShareGPT (0.67 GB), and apt, with a little margin.
expected_download_gb = 190
# RunPod's, so no choice below reads it; kept for a RunPod rerun of the 10-17 matrix. EUR-IS-2's one 4x host reached
# HF at 15 MB/s on 10-16 (issues/vllm-56771/README.md). US-NC-1 handed out GPUs that a process outside the container
# already held (70-90 GB used) on two pods in a row on 10-17.
avoid_data_centers = ["EUR-IS-2", "US-NC-1"]
# Vast only for the P2P pair: the one 4x RunPod host that ran on 10-17 hung NCCL with P2P on (below), and RunPod
# picks the host. The reporter's card first (Max-Q, 300 W), then the 600 W Server and Workstation Editions; free 4x
# boxes listed at $5.87-8.17/hr on 11-05.
gpus = [
  { provider = "vast", id = "RTX PRO 6000 Max-Q", max_usd_hr = 10.0, min_reliability = 0.95 },
  { provider = "vast", id = "RTX PRO 6000 S", max_usd_hr = 10.0, min_reliability = 0.95 },
  { provider = "vast", id = "RTX PRO 6000 WS", max_usd_hr = 10.0, min_reliability = 0.95 },
]

[server]
package = "sglang"
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
launch = ["python3", "-m", "sglang.launch_server", "--model-path", "deepseek-ai/DeepSeek-V4-Flash-0731"]
# The reporter's flags common to every variant. v0.5.22 split --cuda-graph-max-bs into per-phase flags, and argparse
# rejects the old spelling as an ambiguous prefix, so the decode one carries his 64. His
# --disable-flashinfer-autotune is per variant, since s1a turns autotune back on.
base_flags = [
  "--revision", "7872f01b1d1fe23eabc4c98b48bffcef5a386062",
  "--tp-size", "4",
  "--trust-remote-code",
  "--mem-fraction-static", "0.90",
  "--context-length", "1048576",
  "--swa-full-tokens-ratio", "0.1",
  "--max-running-requests", "64",
  "--cuda-graph-max-bs-decode", "64",
  "--kv-cache-dtype", "fp8_e4m3",
  "--disable-custom-all-reduce",
]
port = 30000
# The last pattern is FlashInfer 0.7.1's own dispatch error, the form #33407's boot crash would take on this stack.
fail_pattern = "illegal memory access|cudaErrorIllegalAddress|CUDA error: |SM120 sparse-MLA has no decode kernel"
# Reading 167 GB, the DeepGEMM precompile on the first boot (s1's boot took 474 s on 10-17), and graph capture. s1a's
# extended autotune pass ran 20 min on 10-17 and its boot reached 1,327 s before the OOM; set 2400 again to rerun s1a.
boot_timeout_s = 1800

# 2026-11-05, the decode pair the reporter plans for his own box (README.md): s3-ep4's flags with only NCCL's P2P
# setting changed, NCCL_DEBUG=INFO so each rank's NCCL log names its channels' transport (pre_launch gives it a file;
# post_stop condenses the files into nccl_transport.txt), and decode rows in place of the prefill workloads
# (BENCH_KIND, hooks.sh). They come first
# because `harness run` and `exec` with no names run every variant in file order; name them anyway (README.md).
# With COLL left out, NCCL logs when it builds communicators and connections (the warmup), not per collective.
# P2P on as the reporter runs it, NCCL's defaults. NCCL reads "0" as unset, and setting it keeps an inherited 1 out.
[variants.d1-ep4-p2p-on]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune",
  "--ep-size", "4",
]
env = { NCCL_P2P_DISABLE = "0", NCCL_DEBUG = "INFO", NCCL_DEBUG_SUBSYS = "INIT,ENV,GRAPH", BENCH_KIND = "decode" }
# A P2P path that corrupts data runs at full speed, so the rows need a correctness check beside them (18 s on s3).
[variants.d1-ep4-p2p-on.quality]
gsm8k = 20

# P2P off: every pair through host memory (SHM), as every 10-17 variant ran.
[variants.d2-ep4-p2p-off]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune",
  "--ep-size", "4",
]
env = { NCCL_P2P_DISABLE = "1", NCCL_DEBUG = "INFO", NCCL_DEBUG_SUBSYS = "INIT,ENV,GRAPH", BENCH_KIND = "decode" }
[variants.d2-ep4-p2p-off.quality]
gsm8k = 20

# Run only when d1's nccl_transport.txt shows SHM on some pair. NCCL 2.30.7 defaults to P2P only between GPUs under
# one PCIe switch (PIX or PXB, src/graph/paths.cc:356; the AMD exception at :361 needs two GPUs or fewer), so where
# the GPUs meet at a CPU root port, d1 runs d2's transport. SYS allows P2P on every pair whose NVML read and write
# status is OK. NCCL reads NCCL_P2P_DISABLE before the level (paths.cc:247-253), so an inherited 1 would win; "0"
# keeps it out.
[variants.d3-ep4-p2p-sys]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune",
  "--ep-size", "4",
]
[variants.d3-ep4-p2p-sys.env]
NCCL_P2P_DISABLE = "0"
NCCL_P2P_LEVEL = "SYS"
NCCL_DEBUG = "INFO"
NCCL_DEBUG_SUBSYS = "INIT,ENV,GRAPH"
BENCH_KIND = "decode"
[variants.d3-ep4-p2p-sys.quality]
gsm8k = 20

# Every 10-17 variant sets NCCL_P2P_DISABLE=1, as the vLLM baseline did: on 10-17 a secure 4x host with its GPUs on
# NUMA nodes 0 and 3 hung s1 right after NCCL init for 15 min (GPUs at 100% with 1 GB used), the split-NUMA P2P hang.
# The baseline: the reporter's config without DSpark, first so one number lands even if a later variant fails.
[variants.s1-base]
flags = ["--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune"]
env = { NCCL_P2P_DISABLE = "1" }
[variants.s1-base.quality]
gsm8k = 50

# Expert parallelism, the other half of the vLLM recipe (the reporter's question 2).
[variants.s3-ep4]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune",
  "--ep-size", "4",
]
env = { NCCL_P2P_DISABLE = "1" }
[variants.s3-ep4.quality]
gsm8k = 20

# vLLM's MoE kernel family on sglang, with larger prefill chunks. Autotune never runs for Marlin on this FP8
# checkpoint (flashinfer_autotune.py:129), so the reporter's flag would change nothing here.
[variants.s2-marlin]
flags = ["--moe-runner-backend", "marlin", "--chunked-prefill-size", "8192", "--max-prefill-tokens", "16384"]
env = { NCCL_P2P_DISABLE = "1" }
[variants.s2-marlin.quality]
gsm8k = 20

# s1 with FlashInfer autotune on, so s2 is also measured against a tuned MXFP4 kernel. Autotune runs at boot, before
# graph capture (base_runner.py:268-274); by default it only tunes decode-sized buckets, and DSV4 declines the
# model's own prefill tuning, so SGLANG_FLASHINFER_AUTOTUNE_EXTEND adds one pass at the prefill token ceiling
# (flashinfer_autotune.py:405,415).
[variants.s1a-autotune]
flags = ["--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096"]
env = { NCCL_P2P_DISABLE = "1", SGLANG_FLASHINFER_AUTOTUNE_EXTEND = "1" }
[variants.s1a-autotune.quality]
gsm8k = 20

# The reporter's config as posted, DSpark included; one rep, since it answers whether DSpark costs prefill at all.
[variants.s0-dspark]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "4096", "--disable-flashinfer-autotune",
  "--speculative-algorithm", "DSPARK", "--speculative-attention-mode", "decode",
]
env = { BENCH_REPS = "1", NCCL_P2P_DISABLE = "1" }
[variants.s0-dspark.quality]
gsm8k = 50

# Last, only inside the deadline: the reporter's production layout (DP attention, DP LM head, EP4, from his published
# compose file) without DSpark. 16384 is 4096 per DP rank, s1's chunk. v0.5.22 reads this spelling as
# --attn-dp-size 4, and v0.5.21 (the fallback image) has no --attn-dp-size.
[variants.s4-dp-attn]
flags = [
  "--moe-runner-backend", "flashinfer_mxfp4", "--chunked-prefill-size", "16384", "--disable-flashinfer-autotune",
  "--enable-dp-attention", "--dp-size", "4", "--enable-dp-lm-head", "--ep-size", "4",
]
env = { BENCH_REPS = "1", NCCL_P2P_DISABLE = "1" }
[variants.s4-dp-attn.quality]
gsm8k = 20
